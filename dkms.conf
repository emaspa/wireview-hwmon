# DKMS sources this file, so PACKAGE_VERSION must be a literal. Keep it equal
# to ../VERSION ("make check-version"); the deb/rpm/AUR packaging rewrites it
# from the package version at build time, so the installed copy always
# matches its /usr/src/wireview-hwmon-<ver> directory.
PACKAGE_NAME="wireview-hwmon"
PACKAGE_VERSION="1.6.0"
BUILT_MODULE_NAME[0]="wireview_hwmon"
DEST_MODULE_LOCATION[0]="/extra"
AUTOINSTALL="yes"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
